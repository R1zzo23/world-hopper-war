<!doctype html>
<html lang="en">
	<head>
		<!-- Optional JavaScript -->
		<!-- jQuery first, then Popper.js, then Bootstrap JS -->
		<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
		<script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
		<title>World-Hopper War</title>

		<!-- Required meta tags -->
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	
		<!-- Bootstrap CSS -->
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
		<!-- Stylesheet for CSS -->
		<link rel="stylesheet" type="text/css" href="css/interface.css" />
	</head>

	<body>
		<div class="container"> 
			<!-- Main Information Area -->
			<!-- Top Row -->
			<div class="row text-center">
				<div class="col-sm-12">
					<h4>World-Hopper War</h4>
					<h6>A Glitch in the Nintendo Multiverse</h6>
					<hr />
				</div>
			</div>
			
			<div class="game-container">
				<!-- NEW: Character Display Box -->
				<div class="character-display">
					<div class="character-icon">
					<img src="path/to/character-icon.png" alt="Character" id="characterIcon">
					<!-- Or use emoji placeholder: -->
					<!-- <span class="character-emoji">🦸</span> -->
					</div>
					
					<div class="character-info">
					<h3 class="character-name" id="characterName">Mario</h3>
					
					<div class="character-stats">
						<div class="stat-row">
						<div class="stat-item">
							<span class="stat-label">❤️ HP:</span>
							<div class="stat-bar-container">
							<div class="stat-bar hp-bar" id="hpBar"></div>
							</div>
							<span class="stat-value" id="hpValue">80/100</span>
						</div>
						</div>
						
						<div class="stat-row">
						<div class="stat-item">
							<span class="stat-label">💙 MP:</span>
							<div class="stat-bar-container">
							<div class="stat-bar mp-bar" id="mpBar"></div>
							</div>
							<span class="stat-value" id="mpValue">45/50</span>
						</div>
						</div>
						
						<div class="stat-row attributes">
						<div class="attribute">
							<span class="attr-icon">⚔️</span>
							<span class="attr-label">STR</span>
							<span class="attr-value" id="strValue">20</span>
						</div>
						
						<div class="attribute">
							<span class="attr-icon">🛡️</span>
							<span class="attr-label">DEF</span>
							<span class="attr-value" id="defValue">15</span>
						</div>
						
						<div class="attribute">
							<span class="attr-icon">⚡</span>
							<span class="attr-label">SPD</span>
							<span class="attr-value" id="spdValue">12</span>
						</div>
						</div>
					</div>
					</div>
				</div>
				
				<!-- Your existing story-context div comes after -->
				<div class="story-context">
					<!-- ... -->
				</div>
			</div>


			<div class="row">
				<div class="col-sm-12">
					<div class="game-container" id="cardContainer">
						<div class="story-context">
							<div class="location-header">
								<h2 class="current-location">Current Location</h2>
								<span class="corruption-badge">corruption badge here</span>
							</div>
							<div class="story-text">story text here</div>
						</div>
						
						<div class="choices-container">
							<!-- Buttons will be dynamically generated here -->
						</div>
					</div>
				</div>
			</div>
		</div>
